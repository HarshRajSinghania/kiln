name: pypi

# Publication de kiln sur PyPI (paquet kiln-cli) au tag d'une version promue, `vX.Y.Z` ; jamais
# une candidate `-rc.N`, que seul le canal `interne` suit, par GitHub. Jeton PyPI dans le secret
# `PYPI_TOKEN` de l'environnement `pypi` (posé depuis `.pypi/token`) ; sans lui, trusted
# publishing si PyPI fait confiance à ce workflow.
on:
  push:
    tags: [ "v[0-9]+.[0-9]+.[0-9]+" ]

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/kiln-cli/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Version du tag = version du paquet
        run: |
          paquet="$(uv version --short)"
          if [ "v${paquet}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME}, mais pyproject.toml dit ${paquet}"
            exit 1
          fi
      - name: Construction
        run: uv build
      - name: Publication
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish --trusted-publishing automatic
