<text x="181.6" y="113.5" textLength="117.6" fill="#8c8c87">~/code/atelier</text>
<text x="38.8" y="149.5" textLength="42.0" font-weight="bold">Usage</text>
<text x="97.6" y="149.5" textLength="33.6">kiln</text>
<text x="139.6" y="149.5" textLength="168.0" fill="#8c8c87">&lt;commande&gt; [options]</text>
<text x="38.8" y="185.5" textLength="50.4" fill="#f79628" font-weight="bold">PROJET</text>
<text x="55.6" y="203.5" textLength="25.2" fill="#b9b9b4" font-weight="bold">new</text>
<text x="181.6" y="203.5" textLength="277.2">Générer un nouveau projet complet</text>
<text x="55.6" y="221.5" textLength="58.8" fill="#b9b9b4" font-weight="bold">install</text>
<text x="181.6" y="221.5" textLength="268.8">Préparer le poste après un clone</text>
<text x="55.6" y="239.5" textLength="50.4" fill="#b9b9b4" font-weight="bold">update</text>
<text x="181.6" y="239.5" textLength="294.0">Mettre à jour modèle et dépendances</text>
<text x="55.6" y="257.5" textLength="25.2" fill="#b9b9b4" font-weight="bold">set</text>
<text x="181.6" y="257.5" textLength="588.0">Afficher ou changer les paramètres du repo (hors d&#x27;un repo : du poste)</text>
<text x="38.8" y="293.5" textLength="100.8" fill="#f79628" font-weight="bold">AU QUOTIDIEN</text>
<text x="55.6" y="311.5" textLength="25.2" fill="#b9b9b4" font-weight="bold">dev</text>
<text x="181.6" y="311.5" textLength="210.0">Lancer le projet en local</text>
<text x="55.6" y="329.5" textLength="42.0" fill="#b9b9b4" font-weight="bold">check</text>
<text x="181.6" y="329.5" textLength="252.0">Lancer les contrôles du projet</text>
<text x="55.6" y="347.5" textLength="16.8" fill="#b9b9b4" font-weight="bold">ci</text>
<text x="181.6" y="347.5" textLength="319.2">Rejouer la CI d&#x27;un commit sur le poste</text>
<text x="55.6" y="365.5" textLength="58.8" fill="#b9b9b4" font-weight="bold">contrat</text>
<text x="181.6" y="365.5" textLength="369.6">Régénérer openapi.json et les types du front</text>
<text x="38.8" y="401.5" textLength="117.6" fill="#f79628" font-weight="bold">TOUS LES REPOS</text>
<text x="55.6" y="419.5" textLength="50.4" fill="#b9b9b4" font-weight="bold">status</text>
<text x="181.6" y="419.5" textLength="319.2">État des repos kiln du dossier de code</text>
<text x="55.6" y="437.5" textLength="100.8" fill="#b9b9b4" font-weight="bold">update --all</text>
<text x="181.6" y="437.5" textLength="386.4">Mettre à jour chaque repo kiln, fusion directe</text>
<text x="38.8" y="473.5" textLength="67.2" fill="#f79628" font-weight="bold">EXEMPLES</text>
<text x="55.6" y="491.5" textLength="8.4" fill="#5f5f5c">$</text>
<text x="72.4" y="491.5" textLength="394.8">kiln new atelier --size ember --backend fastapi</text>
<text x="55.6" y="509.5" textLength="8.4" fill="#5f5f5c">$</text>
<text x="72.4" y="509.5" textLength="159.6">kiln update --major</text>
<text x="55.6" y="527.5" textLength="8.4" fill="#5f5f5c">$</text>
<text x="72.4" y="527.5" textLength="168.0">kiln set podman=true</text>
<text x="55.6" y="545.5" textLength="8.4" fill="#5f5f5c">$</text>
<text x="72.4" y="545.5" textLength="554.4">kiln set equipe=alice,bob     # hors d&#x27;un repo : réglages du poste</text>
<text x="38.8" y="581.5" textLength="184.8" font-weight="bold">kiln &lt;commande&gt; --help</text>
<text x="232.0" y="581.5" textLength="394.8" fill="#8c8c87">pour les options · github.com/antoine-tena/kiln</text>
