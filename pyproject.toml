[project]
name = "kiln"
version = "0.2.0"
description = "Orchestrateur de repos : génère un projet, règle ses paramètres et le tient à jour"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["copier>=9.4,<10", "packaging>=24"]

[project.scripts]
kiln = "kiln.cli:main"
charte = "kiln.charte.charte:lancer"

# Le journal des versions voyage avec l'outil : `kiln update` en montre les nouveautés.
[tool.hatch.build.targets.wheel.force-include]
"CHANGELOG.md" = "kiln/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["mypy", "pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
# Les fichiers du modèle sont vérifiés dans les projets générés (tests et kiln check).
extend-exclude = ["template"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "ANN"]

[tool.ruff.lint.per-file-ignores]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["copier", "copier.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true
